networks:
  npnet:
    external: true

services:
  bot:
    build: .
    container_name: mmm-bot
    restart: unless-stopped
    env_file: .env
    expose:
      - "8001"
    networks:
      - npnet
    volumes:
      - ./trade.db:/app/bot/trade.db
      - ./social:/app/social
      - ./bot.log:/app/bot/bot.log

  ton-bot:
    build:
      context: .
      dockerfile: Dockerfile.ton
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./ton.db:/app/ton-bot/ton.db
