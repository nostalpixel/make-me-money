services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./trade.db:/app/bot/trade.db
      - ./social:/app/social
      - ./bot.log:/app/bot/bot.log

  ton-bot:
    build:
      context: .
      dockerfile: Dockerfile.ton
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./ton.db:/app/ton-bot/ton.db
